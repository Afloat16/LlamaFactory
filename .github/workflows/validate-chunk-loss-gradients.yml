name: Validate chunk-loss head gradient scaling
on:
  push:
    branches:
      - validation/chunk-loss-head-gradient-scaling-20261113
permissions:
  contents: read
jobs:
  native-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 20dd15a6f63097c40cf52c379cdda764f74d57dd
          fetch-depth: 5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 torchvision==0.24.1 torchaudio==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . torch==2.9.1 torchvision==0.24.1 torchaudio==2.9.1 transformers==4.57.1 accelerate==1.11.0 peft==0.18.1 trl==0.24.0 datasets==4.0.0 pytest==9.0.2 ruff==0.15.9
          python -m pip freeze > installed-dependencies.txt
      - name: Test exact chunked and eager training
        run: |
          test "$(git rev-parse HEAD)" = "20dd15a6f63097c40cf52c379cdda764f74d57dd"
          set +e
          python -m pytest -q tests_v1/plugins/model_plugins/test_chunk_loss_gradient_scaling.py --junitxml=patched-results.xml > patched.log 2>&1
          result=$?
          set -e
          cat patched.log
          test "$result" -eq 0
          python -m pytest -q tests_v1/plugins/model_plugins/test_chunk_loss.py --junitxml=existing-results.xml > existing.log 2>&1
          cat existing.log
      - name: Reproduce unchanged upstream head-gradient conversion
        if: always()
        run: |
          git checkout 6d1059c727450a4f58e56ad204d01a71abad7781 -- src/llamafactory/v1/plugins/model_plugins/chunk_loss.py
          set +e
          python -m pytest -q tests_v1/plugins/model_plugins/test_chunk_loss_gradient_scaling.py --junitxml=baseline-results.xml > baseline.log 2>&1
          result=$?
          set -e
          cat baseline.log
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("baseline-results.xml").getroot()
          suites = list(root.iter("testsuite"))
          errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
          print({"errors": errors, "failures": failures})
          assert errors == 0 and failures > 0
          PY
      - name: Restore exact final source and check style
        if: always()
        run: |
          git checkout 20dd15a6f63097c40cf52c379cdda764f74d57dd -- src/llamafactory/v1/plugins/model_plugins/chunk_loss.py
          ruff check src/llamafactory/v1/plugins/model_plugins/chunk_loss.py tests_v1/plugins/model_plugins/test_chunk_loss_gradient_scaling.py
          ruff format --check --diff src/llamafactory/v1/plugins/model_plugins/chunk_loss.py tests_v1/plugins/model_plugins/test_chunk_loss_gradient_scaling.py
          git diff --check 6d1059c727450a4f58e56ad204d01a71abad7781
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chunk-loss-gradient-native-before-after
          path: |
            *.log
            *results.xml
            installed-dependencies.txt
