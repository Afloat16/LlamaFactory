name: Validate ASFT token normalization
on:
  push:
    branches:
      - validation/asft-token-normalization-20261112
permissions:
  contents: read
jobs:
  native-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 419ecfc77dd595f8851297d9d2b8e37f9fba7c57
          fetch-depth: 5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 torchvision==0.24.1 torchaudio==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . torch==2.9.1 torchvision==0.24.1 torchaudio==2.9.1 transformers==4.57.1 accelerate==1.11.0 peft==0.18.1 trl==0.24.0 datasets==4.0.0 pytest==9.0.2 ruff==0.15.9
          python -m pip freeze > installed-dependencies.txt
      - name: Test the exact patched source with native Trainer and two-rank Gloo
        run: |
          test "$(git rev-parse HEAD)" = "419ecfc77dd595f8851297d9d2b8e37f9fba7c57"
          set +e
          python -m pytest -q tests/train/test_asft_token_normalization.py --junitxml=patched-results.xml > patched.log 2>&1
          result=$?
          set -e
          cat patched.log
          test "$result" -eq 0
      - name: Reproduce unchanged upstream normalization with the identical tests
        if: always()
        run: |
          git checkout 6d1059c727450a4f58e56ad204d01a71abad7781 -- src/llamafactory/train/sft/trainer.py src/llamafactory/train/trainer_utils.py
          set +e
          python -m pytest -q tests/train/test_asft_token_normalization.py --junitxml=baseline-results.xml > baseline.log 2>&1
          result=$?
          set -e
          cat baseline.log
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("baseline-results.xml").getroot()
          suites = list(root.iter("testsuite"))
          errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
          print({"errors": errors, "failures": failures})
          assert errors == 0 and failures > 0
          PY
      - name: Restore exact final source and check style
        if: always()
        run: |
          git checkout 419ecfc77dd595f8851297d9d2b8e37f9fba7c57 -- src/llamafactory/train/sft/trainer.py src/llamafactory/train/trainer_utils.py
          ruff check src/llamafactory/train/sft/trainer.py src/llamafactory/train/trainer_utils.py tests/train/test_asft_token_normalization.py
          ruff format --check --diff src/llamafactory/train/sft/trainer.py src/llamafactory/train/trainer_utils.py tests/train/test_asft_token_normalization.py
          git diff --check 6d1059c727450a4f58e56ad204d01a71abad7781
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asft-native-before-after
          path: |
            *.log
            *results.xml
            installed-dependencies.txt
