name: Validate v1 SFT single cross entropy
on:
  push:
    branches: [validation/v1-sft-single-cross-entropy-20261113]
permissions:
  contents: read
jobs:
  native-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 torchvision==0.24.1 torchaudio==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . torch==2.9.1 torchvision==0.24.1 torchaudio==2.9.1 transformers==4.57.1 accelerate==1.11.0 peft==0.18.1 trl==0.24.0 datasets==4.0.0 pytest==9.0.2 ruff==0.15.9
          python -m pip freeze > installed-dependencies.txt
      - name: Compare weighted losses, gradients, updates, and operator costs
        run: python validation/run_sft_single_cross_entropy.py
      - name: Verify production style
        if: always()
        run: |
          ruff check src/llamafactory/v1/core/base_trainer.py tests_v1/trainers/test_sft_logprob_forward.py
          ruff format --check src/llamafactory/v1/core/base_trainer.py tests_v1/trainers/test_sft_logprob_forward.py
          git diff --check 6d1059c727450a4f58e56ad204d01a71abad7781
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sft-single-cross-entropy-before-after
          path: |
            *.log
            *.xml
            validation_result.json
            installed-dependencies.txt
